[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive (password)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive (password+header)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive (compression level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive (password+header+level)"

[[mgr.prepend_keymap]]
on   = [ "e", "t" ]
run  = "plugin eza-preview"
desc = "Toggle tree/list dir preview"

[[mgr.prepend_keymap]]
on   = [ "e", "-" ]
run  = "plugin eza-preview inc-level"
desc = "Increment tree level"

[[mgr.prepend_keymap]]
on   = [ "e", "_" ]
run  = "plugin eza-preview dec-level"
desc = "Decrement tree level"

[[mgr.prepend_keymap]]
on   = [ "e", "$" ]
run  = "plugin eza-preview toggle-follow-symlinks"
desc = "Toggle tree follow symlinks"

[[mgr.prepend_keymap]]
on   = [ "e", "*" ]
run  = "plugin eza-preview toggle-hidden"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on   = [ "e", "g", "i" ]
run  = "plugin eza-preview toggle-git-ignore"
desc = "Toggle .gitignore files"

[[mgr.prepend_keymap]]
on   = [ "e", "g", "s" ]
run  = "plugin eza-preview toggle-git-status"
desc = "Toggle showing git status"

[[mgr.prepend_keymap]]
on   = [ "u", "u" ]
run  = "plugin restore"
desc = "Restore last deleted files/folders"

[[mgr.prepend_keymap]]
on   = [ "u", "U" ]
run  = "plugin restore -- --interactive"
desc = "Restore deleted files/folders (Interactive)"

[[mgr.prepend_keymap]]
on   = [ ".", "s" ]
run  = "plugin what-size"
desc = "Calc size of selection or cwd"

[[mgr.prepend_keymap]]
on   = [ ".", "." ]
run  = "hidden toggle"
desc = "Show/Hide hidden files and folders"

[[mgr.prepend_keymap]]
on   = "<C-r>"
run  = "plugin duck-radar"
desc = "🦆 Duck Radar - Recent Files"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"
[[mgr.prepend_keymap]]
on = "<C-y>"
run = ["plugin wl-clipboard"]
desc = "Copy file to clipboard"
